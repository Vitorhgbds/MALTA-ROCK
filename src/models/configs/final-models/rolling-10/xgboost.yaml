model_type: 'XGBoost'
params:
  n_estimators: 500
  subsample: 0.7
  colsample_bytree: 0.8
  learning_rate: 0.001
policy:
  name: 'rolling(10)-1665-wells'
  total_wells: 1665
  apply_scaling: true
  apply_presence: true
  apply_rolling_stats: true
  rolling_window: 10
  labels:
    - 'ARENITO'
    - 'FOLHELHO'
    - 'SILTITO'
    - 'CALCILUTITO'
    - 'CALCARENITO'
    - 'ARGILITO'
    - 'CALCARIO'
    - 'CONGLOMERADO'
    - 'DIABASIO'
    - 'ANIDRITA'
    - 'AREIA'
    - 'DIAMICTITO'
    - 'MARGA'
    - 'ARGILA'
    - 'DOLOMITO'
  test_size: 0.2
  random_state: 42
trials: 1